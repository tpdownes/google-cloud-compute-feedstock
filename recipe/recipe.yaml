schema_version: 1

context:
  name: google-cloud-compute
  version: "1.51.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 45d95bdb065244dda61d4db3984c6684ba1fc76107fa3c7882a35a3e8b450cea

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.25.0,<3.0.0
    - grpcio >=1.59.0,<2.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # use Python 3.13 version constraint to keep package noarch
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0

tests:
  - python:
      imports:
        - google
        - google.api_core
        - google.cloud
        - google.cloud.compute
        - grpc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python Client for Google Cloud Compute Engine
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-compute
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-compute
  documentation: https://googleapis.dev/python/compute/latest/index.html

extra:
  recipe-maintainers:
    - tpdownes
    - tswast
    - mgorny
